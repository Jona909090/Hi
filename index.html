<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>IVANA</title>
<style>
* {
  box-sizing: border-box;
}
html, body {
  position: fixed;
  inset: 0;
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: clip;
  overscroll-behavior: none;
  touch-action: none;
  background: #000;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  height: 100svh;
  background: #000 url("ivana-new.jpg?v=20261010-4") center top / contain no-repeat;
  pointer-events: none;
}
</style>
</head>
<body aria-label="Ivana Zeleničić">
<script>
(function () {
  var stop = function (event) { event.preventDefault(); };
  document.addEventListener("touchmove", stop, { passive: false });
  document.addEventListener("wheel", stop, { passive: false });
  document.addEventListener("gesturestart", stop, { passive: false });
  window.addEventListener("scroll", function () { window.scrollTo(0, 0); }, { passive: true });
})();
</script>
</body>
</html>
